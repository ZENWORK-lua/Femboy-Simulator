<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Femboy Simulator'e hoşgeldiniz!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0c10;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    .stage-container {
      position: relative;
      width: 900px;
      height: 600px;
      background: #14161f;
      border: 2px solid #2e3248;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border-radius: 14px;
    }

    #ui-container {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #ui-container.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(-50%) scale(1.15);
    }

    .maid-btn {
      background: #1e1e2e;
      border: 2px solid #6366f1;
      color: white;
      font-size: 32px;
      padding: 16px 24px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }
    .maid-btn:hover {
      background: #6366f1;
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.9);
      transform: scale(1.05);
    }

    .speech-bubble {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #0f1015;
      padding: 14px 28px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
    }
    .speech-bubble.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="stage-container">
    <div class="speech-bubble" id="bubble"></div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    
    <div id="ui-container">
      <button class="maid-btn" onclick="transformMaid()">
        👗 <span>➡️</span>
      </button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiContainer = document.getElementById('ui-container');
const bubble = document.getElementById('bubble');

class InteractiveCharacter {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    
    this.scale = 2.8;      
    this.dotR = 1.4;       
    this.size = 144;       
    this.timer = 0;
    
    this.outfit = 'casual';
    this.action = 'idle';

    this.colors = {
      skin: '#fcd3b6',
      skinShadow: '#dfaf8e',
      blush: 'rgba(244, 63, 94, 0.75)', 
      hair: '#291b13',
      eyebrow: '#170e0a',
      denim: '#345e8a',
      denimLight: '#4a79a5',
      shirt: '#18181f',
      pants: '#1e212b',
      maidBlack: '#18181f',
      maidWhite: '#ffffff',
      maidFrill: '#e2e8f0'
    };
  }

  dot(cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  dotCluster(cx, cy, radius, color) {
    const step = this.dotR * 2.0; 
    for (let y = -radius; y <= radius; y += step) {
      for (let x = -radius; x <= radius; x += step) {
        if (x * x + y * y <= radius * radius) {
          this.dot(cx + x, cy + y, this.dotR, color);
        }
      }
    }
  }

  draw() {
    this.timer += 0.05;
    
    const bob = Math.sin(this.timer * (this.action === 'shy' ? 8 : 4)) * (this.action === 'shy' ? 3 : 1.5);
    const crouch = this.action === 'shy' ? 12 : 0; 

    ctx.save();
    ctx.translate(this.x, this.y + crouch);
    ctx.scale(this.scale, this.scale);
    ctx.translate(-this.size / 2, -this.size / 2);

    // --- 1. BACAKLAR VE ALT GİYİM ---
    if (this.outfit === 'casual') {
      this.dotCluster(56, 122 + bob, 12, this.colors.pants);
      this.dotCluster(88, 122 + bob, 12, this.colors.pants);
    } else {
      // Çıplak üst bacak (Ten Rengi)
      this.dotCluster(60, 114 + bob, 7, this.colors.skin);
      this.dotCluster(84, 114 + bob, 7, this.colors.skin);
      // Dizüstü Çorap Fırfırları
      this.dotCluster(60, 122 + bob, 8, this.colors.maidWhite);
      this.dotCluster(84, 122 + bob, 8, this.colors.maidWhite);
      // Siyah Dizüstü Çorap
      this.dotCluster(60, 134 + bob, 7, this.colors.maidBlack);
      this.dotCluster(84, 134 + bob, 7, this.colors.maidBlack);
    }

    // --- 2. GÖVDE VE DETAYLI KIYAFET ---
    if (this.outfit === 'casual') {
      this.dotCluster(72, 82 + bob, 24, this.colors.shirt);
      this.dotCluster(60, 82 + bob, 18, this.colors.denimLight);
      this.dotCluster(84, 82 + bob, 18, this.colors.denimLight);
      this.dotCluster(60, 64 + bob, 8, this.colors.denim);
      this.dotCluster(84, 64 + bob, 8, this.colors.denim);
    } else {
      // Açık Yaka (Ten Rengi Göğüs/Boyun Kısmı)
      this.dotCluster(72, 65 + bob, 11, this.colors.skin);
      // Dar Korse/Bel
      this.dotCluster(72, 78 + bob, 15, this.colors.maidBlack);
      // Kabarık Kısa Etek
      this.dotCluster(72, 95 + bob, 24, this.colors.maidBlack); 
      this.dotCluster(72, 102 + bob, 26, this.colors.maidWhite); // Etek ucu fırfırı
      // Beyaz Önlük
      this.dotCluster(72, 82 + bob, 14, this.colors.maidWhite); 
      
      // Kısa Kollar (Omuzda fırfırlı kabarık kumaş)
      this.dotCluster(48, 72 + bob, 8, this.colors.maidBlack);
      this.dotCluster(96, 72 + bob, 8, this.colors.maidBlack);
      this.dotCluster(48, 78 + bob, 6, this.colors.maidWhite); // Kol ucu fırfırı
      this.dotCluster(96, 78 + bob, 6, this.colors.maidWhite); 
    }

    // --- 3. KAFA VE SAÇ ---
    this.dotCluster(72, 48 + bob, 18, this.colors.skinShadow); 
    this.dotCluster(72, 40 + bob, 24, this.colors.skin);       
    
    this.dotCluster(50, 36 + bob, 7, this.colors.hair);
    this.dotCluster(94, 36 + bob, 7, this.colors.hair);
    this.dotCluster(72, 22 + bob, 24, this.colors.hair);

    // Hizmetçi Tacı
    if (this.outfit === 'maid') {
      this.dotCluster(54, 18 + bob, 6, this.colors.maidWhite);
      this.dotCluster(90, 18 + bob, 6, this.colors.maidWhite);
      this.dotCluster(72, 14 + bob, 12, this.colors.maidFrill);
    }

    // --- 4. YÜZ İFADESİ VE UTANMA ---
    if (this.action === 'shy') {
      this.dotCluster(63, 39 + bob, 3.5, this.colors.eyebrow);
      this.dotCluster(81, 39 + bob, 3.5, this.colors.eyebrow);
    } else {
      this.dotCluster(63, 35 + bob, 4.5, this.colors.eyebrow);
      this.dotCluster(81, 35 + bob, 4.5, this.colors.eyebrow);
    }
    
    this.dot(64, 42 + bob, 3.5, '#0a0a0f');
    this.dot(82, 42 + bob, 3.5, '#0a0a0f');
    this.dot(65, 40.5 + bob, 1.5, '#ffffff'); 
    this.dot(83, 40.5 + bob, 1.5, '#ffffff');

    if (this.action === 'shy') {
      this.dotCluster(56, 48 + bob, 7, this.colors.blush);
      this.dotCluster(88, 48 + bob, 7, this.colors.blush);
    }

    if (this.action === 'wave' || this.action === 'point') {
      this.dotCluster(72, 53 + bob, 4, '#aa5b4c'); 
      this.dotCluster(72, 54 + bob, 2, '#ffffff'); 
    } else if (this.action === 'shy') {
      this.dot(72, 54 + bob, 2.5, '#aa5b4c'); 
    } else {
      this.dotCluster(72, 52 + bob, 2.5, '#aa5b4c'); 
    }

    // --- 5. KOLLAR VE ELLER ---
    if (this.action === 'wave') {
      // Sol Kol
      if(this.outfit === 'casual') this.dotCluster(44, 80 + bob, 15, this.colors.denim);
      else this.dotCluster(48, 90 + bob, 5, this.colors.skin); 

      // Sağ Kol (Havada)
      const waveMotion = Math.sin(this.timer * 8) * 10;
      if(this.outfit === 'casual') this.dotCluster(110 + waveMotion, 45 - waveMotion, 12, this.colors.denim);
      else this.dotCluster(110 + waveMotion, 45 - waveMotion, 5, this.colors.skin); 
      
      this.dotCluster(115 + waveMotion, 32 - waveMotion, 9, this.colors.skin); 
    } 
    else if (this.action === 'point') {
      if(this.outfit === 'casual') this.dotCluster(44, 80 + bob, 15, this.colors.denim);
      else this.dotCluster(48, 90 + bob, 5, this.colors.skin);

      if(this.outfit === 'casual') this.dotCluster(110, 78 + bob, 14, this.colors.denim);
      else this.dotCluster(110, 78 + bob, 6, this.colors.skin);
      
      this.dotCluster(135, 78 + bob, 8, this.colors.skin); 
    }
    else if (this.action === 'shy') {
      // Utanınca çıplak kollarıyla göğsünü/yüzünü kapatmaya çalışır
      this.dotCluster(58, 72 + bob, 7, this.colors.skin); 
      this.dotCluster(86, 72 + bob, 7, this.colors.skin); 
    } 
    else {
      // Idle (Bekleme)
      if(this.outfit === 'casual') {
        this.dotCluster(44, 82 + bob, 15, this.colors.denim);
        this.dotCluster(100, 82 + bob, 15, this.colors.denim);
        this.dotCluster(44, 100 + bob, 8, this.colors.skin);
        this.dotCluster(100, 100 + bob, 8, this.colors.skin);
      } else {
        // Çıplak, aşağı sarkan ince kollar
        this.dotCluster(48, 90 + bob, 5, this.colors.skin);
        this.dotCluster(96, 90 + bob, 5, this.colors.skin);
        this.dotCluster(48, 102 + bob, 7, this.colors.skin);
        this.dotCluster(96, 102 + bob, 7, this.colors.skin);
      }
    }

    ctx.restore();
  }
}

const char = new InteractiveCharacter(canvas.width / 2, canvas.height / 2);

function showBubble(text, duration) {
  bubble.innerText = text;
  bubble.classList.add('visible');
  if (duration) {
    setTimeout(() => { bubble.classList.remove('visible'); }, duration);
  }
}

function startSequence() {
  char.action = 'wave';
  showBubble("Ben Anıl! hoşgeldin.", 2200);
  
  setTimeout(() => {
    char.action = 'point';
    showBubble("aa şurda buton çıktı, ona bi tıklasana...", 2000);
    
    setTimeout(() => {
      uiContainer.classList.add('visible');
    }, 500);

  }, 2500);

  setTimeout(() => {
    char.action = 'idle';
  }, 4500);
}

function transformMaid() {
  uiContainer.classList.remove('visible');
  char.outfit = 'maid';
  char.action = 'shy';
  showBubble("B-bu n-n-ne amk?!?! nyahh!!! P-poyraz-chan sil şunu!!", 5000);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  char.draw();
  requestAnimationFrame(loop);
}

loop();
setTimeout(startSequence, 1200);

</script>
</body>
</html>
