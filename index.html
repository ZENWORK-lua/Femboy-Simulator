<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Dot-Matrix Troll Simulator (HD Sürüm)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0c10;
      color: #e2e8f0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    /* Daha büyük, HD Sahne */
    .stage-container {
      position: relative;
      width: 900px;
      height: 600px;
      background: #14161f;
      border: 2px solid #2e3248;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      border-radius: 14px;
    }

    /* İşaret Edilen UI */
    #ui-container {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #ui-container.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateY(-50%) scale(1.15);
    }

    .maid-btn {
      background: #1e1e2e;
      border: 2px solid #6366f1;
      color: white;
      font-size: 32px;
      padding: 16px 24px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
    }
    .maid-btn:hover {
      background: #6366f1;
      box-shadow: 0 0 35px rgba(99, 102, 241, 0.9);
      transform: scale(1.05);
    }

    /* Konuşma Balonu */
    .speech-bubble {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      color: #0f1015;
      padding: 14px 28px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 10;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.95) transparent transparent transparent;
    }
    .speech-bubble.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="stage-container">
    <div class="speech-bubble" id="bubble"></div>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    
    <div id="ui-container">
      <button class="maid-btn" onclick="transformMaid()">
        👗 <span>➡️</span>
      </button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiContainer = document.getElementById('ui-container');
const bubble = document.getElementById('bubble');

class InteractiveCharacter {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    
    // HD KALİTE AYARLARI
    this.scale = 2.8;      // Karakteri devasa yapar
    this.dotR = 1.4;       // Noktalar daha ince (yüksek çözünürlük hissi)
    this.size = 144;       // İç matris alanı
    this.timer = 0;
    
    this.outfit = 'casual';
    this.action = 'idle';

    this.colors = {
      skin: '#fcd3b6',
      skinShadow: '#dfaf8e',
      blush: 'rgba(244, 63, 94, 0.75)', // Daha belirgin anime kızarıklığı
      hair: '#291b13',
      eyebrow: '#170e0a',
      denim: '#345e8a',
      denimLight: '#4a79a5',
      shirt: '#18181f',
      pants: '#1e212b',
      maidBlack: '#121217',
      maidWhite: '#ffffff',
      maidFrill: '#e2e8f0'
    };
  }

  dot(cx, cy, r, color) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  dotCluster(cx, cy, radius, color) {
    // Adım aralığını daraltarak yoğunluğu (çözünürlüğü) artırıyoruz
    const step = this.dotR * 2.0; 
    for (let y = -radius; y <= radius; y += step) {
      for (let x = -radius; x <= radius; x += step) {
        if (x * x + y * y <= radius * radius) {
          this.dot(cx + x, cy + y, this.dotR, color);
        }
      }
    }
  }

  draw() {
    this.timer += 0.05;
    
    const bob = Math.sin(this.timer * (this.action === 'shy' ? 8 : 4)) * (this.action === 'shy' ? 3 : 1.5);
    const crouch = this.action === 'shy' ? 12 : 0; // Utanınca daha çok çöksün

    ctx.save();
    
    // Büyütme (Scale) İşlemi
    ctx.translate(this.x, this.y + crouch);
    ctx.scale(this.scale, this.scale);
    ctx.translate(-this.size / 2, -this.size / 2);

    // --- 1. BACAKLAR VE ALT GİYİM ---
    if (this.outfit === 'casual') {
      this.dotCluster(56, 122 + bob, 12, this.colors.pants);
      this.dotCluster(88, 122 + bob, 12, this.colors.pants);
    } else {
      this.dotCluster(56, 122 + bob, 11, this.colors.maidBlack);
      this.dotCluster(88, 122 + bob, 11, this.colors.maidBlack);
      this.dotCluster(56, 134 + bob, 7, this.colors.maidWhite); // Dizaltı Çorap
      this.dotCluster(88, 134 + bob, 7, this.colors.maidWhite);
    }

    // --- 2. GÖVDE VE DETAYLI KIYAFET ---
    if (this.outfit === 'casual') {
      // Arka plan siyah tişört (Daha geniş)
      this.dotCluster(72, 82 + bob, 24, this.colors.shirt);
      // Sağ-Sol Kot Ceket Önü Açık Tasarım
      this.dotCluster(60, 82 + bob, 18, this.colors.denimLight);
      this.dotCluster(84, 82 + bob, 18, this.colors.denimLight);
      // Ceket Yakaları
      this.dotCluster(60, 64 + bob, 8, this.colors.denim);
      this.dotCluster(84, 64 + bob, 8, this.colors.denim);
    } else {
      // Maid Elbisesi Detayları
      this.dotCluster(72, 82 + bob, 25, this.colors.maidBlack); // Ana elbise
      this.dotCluster(72, 86 + bob, 18, this.colors.maidWhite); // Önlük
      this.dotCluster(72, 70 + bob, 10, this.colors.maidFrill); // Yaka Fırfırları
    }

    // --- 3. KAFA, ÇENE VE SAÇ ---
    this.dotCluster(72, 48 + bob, 18, this.colors.skinShadow); // Çene altı gölgesi
    this.dotCluster(72, 40 + bob, 24, this.colors.skin);       // Yüz
    
    // Saç (Yanlar kısa, üst kalın)
    this.dotCluster(50, 36 + bob, 7, this.colors.hair);
    this.dotCluster(94, 36 + bob, 7, this.colors.hair);
    this.dotCluster(72, 22 + bob, 24, this.colors.hair);

    // Hizmetçi Tacı (Maid Headband) Utanınca belirir
    if (this.outfit === 'maid') {
      this.dotCluster(54, 18 + bob, 6, this.colors.maidWhite);
      this.dotCluster(90, 18 + bob, 6, this.colors.maidWhite);
      this.dotCluster(72, 14 + bob, 12, this.colors.maidFrill);
    }

    // --- 4. YÜZ, GÖZLER, KAŞLAR VE UTANMA ---
    if (this.action === 'shy') {
      this.dotCluster(63, 39 + bob, 3.5, this.colors.eyebrow);
      this.dotCluster(81, 39 + bob, 3.5, this.colors.eyebrow);
    } else {
      this.dotCluster(63, 35 + bob, 4.5, this.colors.eyebrow);
      this.dotCluster(81, 35 + bob, 4.5, this.colors.eyebrow);
    }
    
    // Gözler (Daha büyük ve net)
    this.dot(64, 42 + bob, 3.5, '#0a0a0f');
    this.dot(82, 42 + bob, 3.5, '#0a0a0f');
    this.dot(65, 40.5 + bob, 1.5, '#ffffff'); // HD Parlama
    this.dot(83, 40.5 + bob, 1.5, '#ffffff');

    // Anime Kızarıklığı
    if (this.action === 'shy') {
      this.dotCluster(56, 48 + bob, 7, this.colors.blush);
      this.dotCluster(88, 48 + bob, 7, this.colors.blush);
    }

    // Ağız Detayı
    if (this.action === 'wave' || this.action === 'point') {
      this.dotCluster(72, 53 + bob, 4, '#aa5b4c'); 
      this.dotCluster(72, 54 + bob, 2, '#ffffff'); // Diş detayı
    } else if (this.action === 'shy') {
      this.dot(72, 54 + bob, 2.5, '#aa5b4c'); // Büzüşmüş ağız
    } else {
      this.dotCluster(72, 52 + bob, 2.5, '#aa5b4c'); // Normal gülümseme
    }

    // --- 5. KOLLAR VE ETKİLEŞİM ---
    if (this.action === 'wave') {
      this.dotCluster(44, 80 + bob, 15, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      const waveMotion = Math.sin(this.timer * 8) * 10;
      this.dotCluster(110 + waveMotion, 45 - waveMotion, 12, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      this.dotCluster(115 + waveMotion, 32 - waveMotion, 9, this.colors.skin); 
    } 
    else if (this.action === 'point') {
      this.dotCluster(44, 80 + bob, 15, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      this.dotCluster(110, 78 + bob, 14, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      this.dotCluster(135, 78 + bob, 8, this.colors.skin); // HD İşaret Eden El
    }
    else if (this.action === 'shy') {
      // Utanınca kolları içe çeker
      this.dotCluster(58, 68 + bob, 10, this.colors.skin);
      this.dotCluster(86, 68 + bob, 10, this.colors.skin);
    } 
    else {
      // Idle
      this.dotCluster(44, 82 + bob, 15, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      this.dotCluster(100, 82 + bob, 15, this.outfit === 'casual' ? this.colors.denim : this.colors.maidBlack);
      this.dotCluster(44, 100 + bob, 8, this.colors.skin);
      this.dotCluster(100, 100 + bob, 8, this.colors.skin);
    }

    ctx.restore();
  }
}

const char = new InteractiveCharacter(canvas.width / 2, canvas.height / 2);

function showBubble(text, duration) {
  bubble.innerText = text;
  bubble.classList.add('visible');
  if (duration) {
    setTimeout(() => { bubble.classList.remove('visible'); }, duration);
  }
}

function startSequence() {
  char.action = 'wave';
  showBubble("Ben Anıl! hoşgeldin.", 2200);
  
  setTimeout(() => {
    char.action = 'point';
    showBubble("aa şurda buton çıktı, ona bi tıklasana...", 2000);
    
    setTimeout(() => {
      uiContainer.classList.add('visible');
    }, 500);

  }, 2500);

  setTimeout(() => {
    char.action = 'idle';
  }, 4500);
}

function transformMaid() {
  uiContainer.classList.remove('visible');
  char.outfit = 'maid';
  char.action = 'shy';
  showBubble("B-bu n-n-ne amk?!?! nyahh!!! P-poyraz-chan sil şunu!!", 5000);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  char.draw();
  requestAnimationFrame(loop);
}

loop();
setTimeout(startSequence, 1200);

</script>
</body>
</html>
